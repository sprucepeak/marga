name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Windows 安装版 ----------
          - platform: 'windows-latest'
            args: ''
            name: 'Windows Installer'
            uploadPlainBinary: false
            # setup.exe → Marga_1.0.0_x64-setup.exe
            # msi     → Marga_1.0.0_x64.msi
            assetPattern: 'Marga_[version]_[arch][setup][ext]'

          # ---------- Windows 免安装版 ----------
          - platform: 'windows-latest'
            args: '--no-bundle'
            name: 'Windows Portable'
            uploadPlainBinary: true
            assetPattern: 'Marga_[version]_[arch]-portable[ext]'

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: |
            ## 下载说明
            - **安装版**：`Marga_x.x.x_x64-setup.exe` 或 `Marga_x.x.x_x64.msi`
            - **免安装版**：`Marga_x.x.x_x64-portable.exe`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          releaseAssetNamePattern: ${{ matrix.assetPattern }}