name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- macOS Apple Silicon ----------
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
            uploadPlainBinary: false

          # ---------- macOS Intel ----------
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS (Intel)'
            uploadPlainBinary: false

          # ---------- Linux x64 ----------
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux x64'
            uploadPlainBinary: false

          # ---------- Windows 安装版 (NSIS) ----------
          - platform: 'windows-latest'
            args: ''
            name: 'Windows Installer'
            uploadPlainBinary: false

          # ---------- Windows 免安装版 (纯 exe) ----------
          - platform: 'windows-latest'
            args: '--no-bundle'
            name: 'Windows Portable'
            uploadPlainBinary: true

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ---------- Linux 系统依赖 ----------
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            xdg-utils

      # ---------- 安装前端依赖 ----------
      # 按你实际使用的包管理器二选一
      - name: Install frontend dependencies
        run: npm install
        # run: pnpm install --frozen-lockfile
        # run: yarn install --frozen-lockfile

      # ---------- 构建 + 上传到 GitHub Release ----------
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 如果启用了 updater 签名，取消注释并配置 Secrets
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: |
            ## 下载说明
            - **Windows 安装版**：下载 `*-setup.exe`
            - **Windows 免安装版**：下载纯 `.exe`，解压/放到任意目录直接运行
            - **macOS**：下载对应架构的 `.dmg` 或 `.app.tar.gz`
            - **Linux**：推荐 `.AppImage` 或 `.deb`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}