<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Neon Glow Gradient for M & Paths -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Fast Route Accent Gradient -->
    <linearGradient id="routeAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Soft Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="routeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Orbit / Routing Guidance Ring (Compass / Mārga concept) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Dynamic Routing Path Lines (Packet Redirection Stream) -->
  <!-- Left incoming stream -->
  <path d="M 90 370 Q 140 370 170 330" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.6" />
  
  <!-- Right outgoing dedicated route stream -->
  <path d="M 342 330 Q 372 370 422 370" fill="none" stroke="url(#routeAccent)" stroke-width="3.5" stroke-linecap="round" filter="url(#routeGlow)" opacity="0.85" />

  <!-- The "M" Core Highway / Gateway (Mārga - The Right Path) -->
  <g filter="url(#glow)">
    <!-- Primary bold route architecture forming 'M' with route arrowheads -->
    <!-- Left Pillar to Center Dip to Right Pillar -->
    <path d="M 148 356 
             L 148 184 
             C 148 162, 172 152, 188 168 
             L 256 244 
             L 324 168 
             C 340 152, 364 162, 364 184 
             L 364 356" 
          fill="none" 
          stroke="url(#mGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Forward Fast-Lane Waypoint Indicator (Diamond Node) -->
    <polygon points="256,220 274,244 256,268 238,244" fill="#38bdf8" />
  </g>

  <!-- Network Nodes / Waypoint Pins on M -->
  <!-- Top Left Entry Node -->
  <circle cx="148" cy="180" r="10" fill="#38bdf8" />
  <circle cx="148" cy="180" r="4" fill="#ffffff" />

  <!-- Top Right Exit Dedicated Node -->
  <circle cx="364" cy="180" r="10" fill="#a855f7" />
  <circle cx="364" cy="180" r="4" fill="#ffffff" />

  <!-- Target Routing Pulse (Upper right pinpoint - destination pinned) -->
  <circle cx="396" cy="120" r="8" fill="#10b981" filter="url(#routeGlow)" />
  <circle cx="396" cy="120" r="18" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />
  <!-- Connecting track line from Exit Node to Dedicated Pin -->
  <path d="M 364 172 L 392 126" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.8" />
</svg>
